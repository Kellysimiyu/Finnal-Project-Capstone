<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
   
    
    {% block body%}<!--This the part where all pages are intergreted on this main layout-->
    {% endblock%}
     <!--styling for all the forms on this website -->
       <style>
        form {
            max-width: 600px;
            margin: 0 auto;
            background-color: black;
            padding: 30px;
            border-radius: 10px;
        }
        form p {
            margin-bottom: 15px;
        }
        form label {
            display: block;
            font-weight: bold;
            color: dodgerblue;
            margin-bottom: 5px;
        }
        form input, 
        form textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid dodgerblue;
            border-radius: 5px;
            background-color: black;
            color: white;
            box-sizing: border-box;
        }
        form input:focus, 
        form textarea:focus {
            outline: none;
            border-color: green;
        }
        .btn-submit {
            background-color: dodgerblue;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: dodgerblue;
        }
        .usr {
            color:red;
            text-align: right;
            font-size: 20px;
            
        }
    </style>
</body>
</html>
